<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <title>生徒指名ランダムルーレット</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>生徒指名ルーレット</h1>

        </div>
